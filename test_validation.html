<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://res.cloudinary.com/dsulhqvza/image/upload/v1761550208/mvvnatural_pbzwrl.png">
    <title>Validación de Reglas - MVV Natural</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
            color: #2f2f2f;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        h1 { color: #B8860B; }
        h2 { color: #006400; margin-top: 30px; }

        .test-case {
            background: #f0f8f0;
            padding: 15px;
            margin: 10px 0;
            border-left: 4px solid #B8860B;
            border-radius: 4px;
        }

        .pass { color: green; font-weight: bold; }
        .fail { color: red; font-weight: bold; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        th, td {
            padding: 10px;
            text-align: left;
            border: 1px solid #ddd;
        }

        th {
            background: #B8860B;
            color: white;
        }

        .summary {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            padding: 20px;
            margin: 20px 0;
            border-radius: 4px;
        }

        .error-summary {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            padding: 20px;
            margin: 20px 0;
            border-radius: 4px;
        }

        iframe {
            position: fixed;
            left: -10000px;
            top: 0;
            width: 390px;
            height: 844px;
            border: 0;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Validación Completa - Sistema de Cotizaciones MVV Natural</h1>
        <p><strong>Fecha de validación:</strong> <span id="testDate"></span></p>
        <p><strong>Fuente oficial:</strong> <span id="sourceName">Cargando...</span></p>
        <div id="results">Cargando aplicación...</div>
    </div>

    <iframe id="appFrame" src="index.html" title="MVV Natural"></iframe>

    <script>
        const resultsEl = document.getElementById('results');
        document.getElementById('testDate').textContent = new Date().toLocaleString('es-MX');

        function resultLine(passed, message) {
            return `<div class="test-case"><span class="${passed ? 'pass' : 'fail'}">${passed ? 'PASS' : 'FAIL'}</span> - ${message}</div>`;
        }

        function runAssertion(state, passed, message) {
            state.total += 1;
            if (passed) state.passed += 1;
            state.html += resultLine(passed, message);
        }

        async function runTests(appWindow) {
            const products = appWindow.MVV_PRODUCTS;
            const calculatePrice = appWindow.MVV_CALCULATE_PRICE;
            const calculateShipping = appWindow.MVV_CALCULATE_SHIPPING;
            const source = appWindow.MVV_PRICE_RULE_SOURCE;
            const state = { total: 0, passed: 0, html: '' };

            document.getElementById('sourceName').textContent = source || 'No expuesta';

            state.html += '<h2>Catálogo</h2>';
            runAssertion(state, Array.isArray(products), 'La app expone el catálogo de productos');
            runAssertion(state, products.length === 108, `Total de productos: ${products.length} (esperado: 108)`);
            runAssertion(state, products[0]?.name === 'FAT BLAZER', `Primer producto: ${products[0]?.name}`);
            runAssertion(state, products[107]?.name === 'LIPO BARBIE', `Último producto: ${products[107]?.name}`);
            runAssertion(state, new Set(products.map(product => product.id)).size === products.length, 'Todos los IDs son únicos');
            runAssertion(state, products.every(product => ['price', 'price10', 'price30', 'price50', 'price100'].every(key => Number.isFinite(product[key]))), 'Todos los productos tienen precios numéricos en los 5 niveles');
            runAssertion(state, products.every(product => !/[a-z]/.test(product.name)), 'Todos los nombres visibles están normalizados en mayúsculas');
            runAssertion(state, products.every(product => !/(THy|ALPA|SAHPE|ZISE|NIGT)/.test(product.name)), 'No quedan typos conocidos en nombres de productos');
            runAssertion(state, products.find(product => product.name === 'LIDA DAIDAIHUA BOOSTER')?.image?.includes('Lidabooster'), 'La imagen Lida Booster está asignada a LIDA DAIDAIHUA BOOSTER');
            runAssertion(state, products.find(product => product.name === 'LIDA BOOSTER ROSA')?.image?.includes('lida-booster-rosa'), 'LIDA BOOSTER ROSA usa la imagen rosa correcta');
            runAssertion(state, !products.find(product => product.name === 'FLORYVA VERDE')?.image && !products.find(product => product.name === 'FLORYVA ROSA PROBIOTICO')?.image, 'Las variantes FLORYVA no usan la imagen Candiclear');
            runAssertion(state, products.find(product => product.name === 'APPLE CIDER')?.image?.includes('applecyder') && !products.find(product => product.name === 'APPLE CIDER QUEMADOR')?.image, 'La imagen Apple Cider Vinagre está asignada a APPLE CIDER, no a QUEMADOR');

            state.html += '<h2>Reglas de Mayoreo Variado</h2>';
            const fatBlazer = products.find(product => product.name === 'FAT BLAZER');
            const duo60 = products.find(product => product.name === 'DUO 60 FUSION XTREME');
            const macaFem = products.find(product => product.name === 'MACA FEM');

            runAssertion(state, calculatePrice(fatBlazer, 5, 5) === 850, 'FAT BLAZER con 5 piezas totales usa precio normal: $850');
            runAssertion(state, calculatePrice(fatBlazer, 1, 10) === 490, 'FAT BLAZER con 10 piezas variadas usa precio10: $490');
            runAssertion(state, calculatePrice(fatBlazer, 1, 30) === 460, 'FAT BLAZER con 30 piezas variadas usa price30: $460');
            runAssertion(state, calculatePrice(fatBlazer, 1, 50) === 430, 'FAT BLAZER con 50 piezas variadas usa price50: $430');
            runAssertion(state, calculatePrice(fatBlazer, 1, 100) === 390, 'FAT BLAZER con 100 piezas variadas usa price100: $390');
            runAssertion(state, calculatePrice(duo60, 1, 30) === 470, 'DUO 60 FUSION XTREME con 30 piezas variadas usa price30: $470');
            runAssertion(state, calculatePrice(macaFem, 1, 100) === 430, 'MACA FEM conserva el precio100 del PDF: $430');

            state.html += '<h2>Envío</h2>';
            runAssertion(state, calculateShipping(1) === null && calculateShipping(100) === null, 'El envío/seguro queda por confirmar y no se suma al total de productos');

            state.html += '<h2>Flujo de Cotización</h2>';
            const appDocument = appWindow.document;
            const alerts = [];
            const originalAlert = appWindow.alert;
            const originalClick = appWindow.HTMLAnchorElement.prototype.click;
            let downloadMeta = null;

            appWindow.alert = message => alerts.push(message);
            appWindow.HTMLAnchorElement.prototype.click = function() {
                downloadMeta = {
                    download: this.download,
                    hrefStart: this.href.slice(0, 23),
                    hrefLength: this.href.length,
                    inDom: appDocument.body.contains(this)
                };
            };

            try {
                appWindow.localStorage.clear();
                appWindow.resetQuote();
                appWindow.goToStep(3);
                runAssertion(state, appDocument.getElementById('step1').classList.contains('active') && alerts.some(message => message.includes('carrito está vacío')), 'No permite generar datos de cliente con el carrito vacío');

                const quoteProducts = [
                    ['FAT BLAZER', 4],
                    ['DUO 60 FUSION XTREME', 3],
                    ['MAXI FIBRA', 2],
                    ['3 DAY RESET', 1],
                    ['THYROIDE SUPPORT', 1]
                ].map(([name, quantity]) => ({ product: products.find(item => item.name === name), quantity }));

                quoteProducts.forEach(({ product, quantity }) => appWindow.setQuantity(product.id, quantity));
                appWindow.goToCart();

                const expectedSubtotal = quoteProducts.reduce((sum, { product, quantity }) => sum + product.price10 * quantity, 0);
                runAssertion(state, appDocument.getElementById('subtotal').textContent === `$${expectedSubtotal}`, `El carrito calcula mayoreo mixto de 11 piezas: $${expectedSubtotal}`);

                appWindow.goToStep(3);
                appDocument.getElementById('customerName').value = 'Cliente Prueba <b>& Co';
                appDocument.getElementById('customerPhone').value = '6312982043';
                appDocument.getElementById('customerStreet').value = 'Calle 123 <script>bad()<\/script>';
                appDocument.getElementById('customerColonia').value = 'Centro & Norte';
                appDocument.getElementById('customerCP').value = '84000';
                appDocument.getElementById('customerCity').value = 'Nogales';
                appDocument.getElementById('customerState').value = 'Sonora';
                appDocument.getElementById('customerReferences').value = 'Portón blanco & esquina';
                appWindow.generateQuote();

                const quoteCustomer = appDocument.getElementById('quoteCustomer');
                const quoteRows = appDocument.querySelectorAll('#quoteItems tr');
                const customerHTML = quoteCustomer.innerHTML;

                runAssertion(state, appDocument.getElementById('step4').classList.contains('active'), 'La app llega al paso final de cotización');
                runAssertion(state, appDocument.getElementById('quoteSubtotal').textContent === `$${expectedSubtotal}` && appDocument.getElementById('quoteTotal').textContent === `$${expectedSubtotal}`, 'La cotización final conserva subtotal y total correctos');
                runAssertion(state, quoteRows.length === quoteProducts.length, `La cotización final muestra ${quoteProducts.length} productos`);
                runAssertion(state, !quoteCustomer.querySelector('script') && customerHTML.includes('&lt;script&gt;bad()&lt;/script&gt;'), 'Los datos del cliente se insertan como texto seguro, no como HTML activo');

                const canvas = await appWindow.downloadQuoteImage(null, { silent: true });
                const quoteImages = Array.from(appDocument.querySelectorAll('#quotePrintArea img'));

                runAssertion(state, quoteImages.every(image => image.complete && image.naturalWidth > 0), 'Todas las imágenes de la cotización cargan antes de exportar');
                runAssertion(state, canvas.width >= 600 && canvas.height >= 1000, `La imagen final se genera con tamaño válido: ${canvas.width}x${canvas.height}`);
                runAssertion(state, downloadMeta?.download?.startsWith('cotizacion_cliente_prueba') && downloadMeta.hrefStart === 'data:image/jpeg;base64,' && downloadMeta.hrefLength > 100000 && downloadMeta.inDom, 'La descarga final genera un JPEG con nombre válido');
            } catch (error) {
                runAssertion(state, false, `El flujo de cotización falló: ${error.message}`);
            } finally {
                appWindow.alert = originalAlert;
                appWindow.HTMLAnchorElement.prototype.click = originalClick;
            }

            if (state.passed === state.total) {
                state.html += '<div class="summary">';
                state.html += '<h2>VALIDACIÓN COMPLETA: 100% EXITOSA</h2>';
                state.html += `<p><strong>${state.passed} de ${state.total} pruebas pasaron correctamente.</strong></p>`;
                state.html += '<p>La aplicación usa preciosnew.pdf como fuente oficial.</p>';
                state.html += '</div>';
            } else {
                state.html += '<div class="error-summary">';
                state.html += '<h2>VALIDACIÓN FALLIDA</h2>';
                state.html += `<p><strong>${state.passed} de ${state.total} pruebas pasaron.</strong></p>`;
                state.html += '</div>';
            }

            state.html += '<h2>Catálogo Completo de Productos (108)</h2>';
            state.html += '<table>';
            state.html += '<thead><tr><th>ID</th><th>Nombre</th><th>Precio</th><th>P10</th><th>P30</th><th>P50</th><th>P100</th></tr></thead>';
            state.html += '<tbody>';
            products.forEach(product => {
                state.html += '<tr>';
                state.html += `<td>${product.id}</td>`;
                state.html += `<td>${product.name}</td>`;
                state.html += `<td>$${product.price}</td>`;
                state.html += `<td>$${product.price10}</td>`;
                state.html += `<td>$${product.price30}</td>`;
                state.html += `<td>$${product.price50}</td>`;
                state.html += `<td>$${product.price100}</td>`;
                state.html += '</tr>';
            });
            state.html += '</tbody></table>';

            resultsEl.innerHTML = state.html;
        }

        document.getElementById('appFrame').addEventListener('load', event => {
            try {
                runTests(event.currentTarget.contentWindow).catch(error => {
                    resultsEl.innerHTML = `<div class="error-summary"><h2>Error de validación</h2><p>${error.message}</p></div>`;
                });
            } catch (error) {
                resultsEl.innerHTML = `<div class="error-summary"><h2>Error de validación</h2><p>${error.message}</p></div>`;
            }
        });
    </script>
</body>
</html>
